
services:
  db:
    image: postgres:15-alpine
    container_name: latido_termico_db
    restart: always
    environment:
      POSTGRES_USER: user_latido_dev
      POSTGRES_PASSWORD: secure_password_2026
      POSTGRES_DB: latido_termico_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: latido_termico_api
    restart: always
    ports:
      - "8000:8000"
    volumes:                 
      - ./backend:/app       
    env_file:
      - ./backend/.env
    depends_on:
      - db

volumes:
  pgdata:
    driver: local